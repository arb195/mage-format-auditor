<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Image Format Auditor</title>
  <link rel="preload" href="fonts/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
  <header>
    <div>
      <h1 data-i18n="title">Image Format Auditor</h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <div class="header-controls">
      <label class="lang-picker">
        <span class="visually-hidden" data-i18n="language">Language</span>
        <select id="lang" data-i18n-title="language"></select>
      </label>
      <div class="theme-toggle" role="group" data-i18n-aria="theme">
        <button type="button" data-mode="light" data-i18n="themeLight" data-i18n-title="themeLightTitle"></button>
        <button type="button" data-mode="auto" data-i18n="themeAuto" data-i18n-title="themeAutoTitle"></button>
        <button type="button" data-mode="dark" data-i18n="themeDark" data-i18n-title="themeDarkTitle"></button>
      </div>
    </div>
  </header>

  <section class="card">
    <div class="row">
      <label class="grow"><span data-i18n="siteUrl"></span>
        <input id="url" type="url" placeholder="https://example.com" dir="ltr">
      </label>
      <div class="buttons">
        <button id="start" class="primary" data-i18n="start"></button>
        <button id="pause" data-i18n="pause" disabled></button>
        <button id="stop" class="danger" data-i18n="stop" disabled></button>
      </div>
    </div>

    <details id="settings">
      <summary data-i18n="settings"></summary>
      <div class="grid">
        <label><span data-i18n="maxPages"></span>
          <input id="maxPages" type="number" min="1" value="5000">
        </label>
        <label><span data-i18n="concurrency"></span>
          <input id="concurrency" type="number" min="1" max="16" value="4">
        </label>
        <label><span data-i18n="delay"></span>
          <input id="delay" type="number" min="0" value="0">
        </label>
        <fieldset>
          <legend data-i18n="okFormats"></legend>
          <label class="inline"><input type="checkbox" class="okfmt" value="webp" checked> WebP</label>
          <label class="inline"><input type="checkbox" class="okfmt" value="svg" checked> SVG</label>
          <label class="inline"><input type="checkbox" class="okfmt" value="avif"> AVIF</label>
          <label class="inline"><input type="checkbox" class="okfmt" value="gif"> GIF</label>
          <label class="inline"><input type="checkbox" class="okfmt" value="ico"> <span data-i18n="icoLabel"></span></label>
        </fieldset>
        <fieldset>
          <legend data-i18n="options"></legend>
          <label class="inline"><input type="checkbox" id="useSitemap" checked> <span data-i18n="useSitemap"></span></label>
          <label class="inline"><input type="checkbox" id="verify" checked> <span data-i18n="verify"></span></label>
          <label class="inline"><input type="checkbox" id="subdomains"> <span data-i18n="subdomains"></span></label>
          <label class="inline"><input type="checkbox" id="parseCss" checked> <span data-i18n="parseCss"></span></label>
          <label class="inline"><input type="checkbox" id="ignoreQuery"> <span data-i18n="ignoreQuery"></span></label>
        </fieldset>
        <label class="full"><span data-i18n="exclude"></span>
          <textarea id="exclude" rows="4" dir="ltr">/wp-admin
/wp-login
logout
/cart
/checkout
add-to-cart=
replytocom=
/feed</textarea>
        </label>
      </div>
    </details>
  </section>

  <section class="stats">
    <div class="stat"><b id="sPages">0</b><span data-i18n="sPages"></span></div>
    <div class="stat"><b id="sQueue">0</b><span data-i18n="sQueue"></span></div>
    <div class="stat"><b id="sImages">0</b><span data-i18n="sImages"></span></div>
    <div class="stat warn"><b id="sBad">0</b><span data-i18n="sBad"></span></div>
    <div class="stat warn"><b id="sBadSize">0</b><span data-i18n="sBadSize"></span></div>
    <div class="stat"><b id="sErrors">0</b><span data-i18n="sErrors"></span></div>
  </section>
  <div id="status" class="status"></div>
  <div class="progress"><div id="bar"></div></div>

  <section class="card">
    <div class="row toolbar">
      <input id="search" type="search" data-i18n-placeholder="search" class="grow">
      <select id="fmtFilter"></select>
      <label class="inline"><input type="checkbox" id="showAll"> <span data-i18n="showAll"></span></label>
    </div>
    <div class="row toolbar">
      <button id="csv1" data-i18n="csv1"></button>
      <button id="csv2" data-i18n="csv2"></button>
      <button id="csvErr" data-i18n="csvErr"></button>
      <button id="copy" data-i18n="copy"></button>
      <span id="formats" class="chips"></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th data-i18n="thPreview"></th>
            <th data-sort="url" data-i18n="thUrl"></th>
            <th data-sort="format" data-i18n="thFormat"></th>
            <th data-sort="size" data-i18n="thSize"></th>
            <th data-sort="pages" data-i18n="thPages"></th>
            <th data-i18n="thWhere"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="row pager">
      <button id="prev" data-i18n="prev"></button>
      <span id="pageInfo"></span>
      <button id="next" data-i18n="next"></button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
